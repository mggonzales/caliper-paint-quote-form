<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caliper Paint – Get a Quote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #111;
      background-image:
        repeating-linear-gradient(
          135deg,
          rgba(255,255,255,0.015) 0px,
          rgba(255,255,255,0.015) 1px,
          transparent 1px,
          transparent 12px
        ),
        repeating-linear-gradient(
          45deg,
          rgba(255,255,255,0.015) 0px,
          rgba(255,255,255,0.015) 1px,
          transparent 1px,
          transparent 12px
        );
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px 64px;
    }

    /* ── Page header ── */
    .page-header {
      text-align: center;
      margin-bottom: 36px;
      max-width: 680px;
    }
    .page-header h1 {
      font-family: 'Lora', serif;
      font-size: 2.4rem;
      font-weight: 500;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    .page-header p {
      font-family: 'Montserrat', sans-serif;
      font-size: 1rem;
      font-weight: 400;
      color: #cccccc;
      line-height: 1.7;
    }

    /* ── Color swatches ── */
    .swatches {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }
    .swatch {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    /* ── Form card ── */
    .form-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 36px 40px 40px;
      width: 100%;
      max-width: 680px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }

    .form-card-title {
      font-family: 'Lora', serif;
      font-size: 1.5rem;
      font-weight: 500;
      color: #020817;
      text-align: center;
      margin-bottom: 6px;
    }

    .form-divider {
      height: 2px;
      background: #2b4ee5;
      border: none;
      margin: 10px 0 24px;
    }

    /* ── Section labels ── */
    .section-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      color: #2b4ee5;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    /* ── Grid layouts ── */
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }
    .grid-1 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }

    /* ── Field labels ── */
    .field-label {
      display: block;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      color: #323232;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .field-label .required {
      color: #e53e3e;
      margin-left: 2px;
    }

    /* ── Inputs & selects ── */
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    select,
    textarea {
      width: 100%;
      background-color: #e6edf3;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 10px 12px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      color: #1a1a2e;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      appearance: none;
      -webkit-appearance: none;
    }
    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="tel"]:focus,
    select:focus,
    textarea:focus {
      border-color: #2b4ee5;
      box-shadow: 0 0 0 3px rgba(43,78,229,0.12);
    }
    input::placeholder, textarea::placeholder {
      color: #9ca3af;
      font-weight: 400;
    }

    /* Select arrow */
    .select-wrapper {
      position: relative;
    }
    .select-wrapper::after {
      content: '▾';
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #6b7280;
      pointer-events: none;
      font-size: 0.9rem;
    }
    select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    textarea {
      resize: vertical;
      min-height: 110px;
    }

    /* ── Submit button ── */
    .submit-btn {
      width: 100%;
      background-color: #2b4ee5;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 14px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 8px;
    }
    .submit-btn:hover { background-color: #1e3bc0; }
    .submit-btn:active { transform: scale(0.99); }
    .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }

    /* ── Status messages ── */
    .status-msg {
      display: none;
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      text-align: center;
    }
    .status-msg.success { background: #d1fae5; color: #065f46; display: block; }
    .status-msg.error   { background: #fee2e2; color: #991b1b; display: block; }
    .status-msg.warning { background: #fef3c7; color: #92400e; display: block; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .form-card { padding: 24px 18px 28px; }
      .grid-3 { grid-template-columns: 1fr; }
      .grid-2 { grid-template-columns: 1fr; }
      .page-header h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <!-- Page Header -->
  <div class="page-header">
    <h1>Caliper Paint</h1>
    <p>Give your car a fresh look with our expert caliper painting service. Whether you prefer bold blood red, sleek black, or a colour to match your style — we've got you covered. Fill in the form below and we'll get back to you with a quote.</p>
  </div>

  <!-- Colour Swatches -->
  <div class="swatches">
    <div class="swatch" style="background:#cc0000;" title="Red"></div>
    <div class="swatch" style="background:#00bcd4;" title="Cyan"></div>
    <div class="swatch" style="background:#1a1a1a;" title="Black"></div>
    <div class="swatch" style="background:#76c442;" title="Green"></div>
    <div class="swatch" style="background:#f5c518;" title="Yellow"></div>
    <div class="swatch" style="background:#e91e8c;" title="Pink"></div>
  </div>

  <!-- Form Card -->
  <div class="form-card">
    <h2 class="form-card-title">Enter for Quote</h2>
    <hr class="form-divider" />

    <form id="caliperForm" novalidate>

      <!-- Vehicle Details -->
      <p class="section-label">Vehicle Details</p>
      <div class="grid-3">
        <div>
          <label class="field-label" for="vehicleYear">Vehicle Year <span class="required">*</span></label>
          <div class="select-wrapper">
            <select id="vehicleYear" name="vehicleYear" required>
              <option value="">Select Vehicle Year</option>
            </select>
          </div>
        </div>
        <div>
          <label class="field-label" for="vehicleMake">Vehicle Make <span class="required">*</span></label>
          <div class="select-wrapper">
            <select id="vehicleMake" name="vehicleMake" required disabled>
              <option value="">Select Make</option>
            </select>
          </div>
        </div>
        <div>
          <label class="field-label" for="vehicleModel">Vehicle Model <span class="required">*</span></label>
          <div class="select-wrapper">
            <select id="vehicleModel" name="vehicleModel" required disabled>
              <option value="">Select Model</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Your Details -->
      <p class="section-label">Your Details</p>
      <div class="grid-2">
        <div>
          <label class="field-label" for="firstName">First Name <span class="required">*</span></label>
          <input type="text" id="firstName" name="firstName" placeholder="Your Name" required />
        </div>
        <div>
          <label class="field-label" for="email">Email Address <span class="required">*</span></label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required />
        </div>
      </div>
      <div class="grid-2">
        <div>
          <label class="field-label" for="phoneNumber">Phone Number <span class="required">*</span></label>
          <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="Eg. 0412 345 678" required />
        </div>
        <div>
          <label class="field-label" for="state">State <span class="required">*</span></label>
          <div class="select-wrapper">
            <select id="state" name="state" required>
              <option value="">Select State</option>
              <option value="ACT">Australian Capital Territory</option>
              <option value="NSW">New South Wales</option>
              <option value="NT">Northern Territory</option>
              <option value="QLD">Queensland</option>
              <option value="SA">South Australia</option>
              <option value="TAS">Tasmania</option>
              <option value="VIC">Victoria</option>
              <option value="WA">Western Australia</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Added Notes -->
      <div class="grid-1">
        <div>
          <label class="field-label" for="addedNotes">Added Notes</label>
          <textarea id="addedNotes" name="addedNotes" placeholder="Tell us more about your caliper paint needs…"></textarea>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">Submit</button>
      <div id="statusMsg" class="status-msg"></div>

    </form>
  </div>

    // ── Populate Year dropdown ─────────────────────────────────────
    const yearSelect  = document.getElementById('vehicleYear');
    const makeSelect  = document.getElementById('vehicleMake');
    const modelSelect = document.getElementById('vehicleModel');

    Object.keys(VEHICLE_DATA).sort((a,b) => b - a).forEach(year => {
      const opt = document.createElement('option');
      opt.value = year;
      opt.textContent = year;
      yearSelect.appendChild(opt);
    });

    // ── Year → Make cascade ────────────────────────────────────────
    yearSelect.addEventListener('change', () => {
      const year = yearSelect.value;
      makeSelect.innerHTML = '<option value="">Select Make</option>';
      modelSelect.innerHTML = '<option value="">Select Model</option>';
      makeSelect.disabled  = true;
      modelSelect.disabled = true;

      if (year && VEHICLE_DATA[year]) {
        Object.keys(VEHICLE_DATA[year]).forEach(make => {
          const opt = document.createElement('option');
          opt.value = make;
          opt.textContent = make;
          makeSelect.appendChild(opt);
        });
        makeSelect.disabled = false;
      }
    });

    // ── Make → Model cascade ───────────────────────────────────────
    makeSelect.addEventListener('change', () => {
      const year  = yearSelect.value;
      const make  = makeSelect.value;
      modelSelect.innerHTML = '<option value="">Select Model</option>';
      modelSelect.disabled  = true;

      if (year && make && VEHICLE_DATA[year] && VEHICLE_DATA[year][make]) {
        VEHICLE_DATA[year][make].forEach(model => {
          const opt = document.createElement('option');
          opt.value = model;
          opt.textContent = model;
          modelSelect.appendChild(opt);
        });
        modelSelect.disabled = false;
      }
    });

    // ── Form submission ────────────────────────────────────────────
    document.getElementById('caliperForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const statusMsg = document.getElementById('statusMsg');
      const submitBtn = document.getElementById('submit-btn');
      statusMsg.className = 'status-msg';
      statusMsg.textContent = '';

      // Webhook URL guard
      if (GHL_WEBHOOK_URL.includes('YOUR_WEBHOOK_ID')) {
        statusMsg.className = 'status-msg warning';
        statusMsg.textContent = 'Webhook URL not configured. Please update GHL_WEBHOOK_URL in the code.';
        return;
      }

      // Basic validation
      const required = ['vehicleYear','vehicleMake','vehicleModel','firstName','email','phoneNumber','state'];
      for (const id of required) {
        const el = document.getElementById(id);
        if (!el.value.trim()) {
          el.focus();
          statusMsg.className = 'status-msg error';
          statusMsg.textContent = 'Please fill in all required fields.';
          return;
        }
      }

      const payload = {
        firstName:    document.getElementById('firstName').value.trim(),
        lastName:     '',
        email:        document.getElementById('email').value.trim(),
        phone:        document.getElementById('phoneNumber').value.trim(),
        vehicleYear:  document.getElementById('vehicleYear').value,
        vehicleMake:  document.getElementById('vehicleMake').value,
        vehicleModel: document.getElementById('vehicleModel').value,
        state:        document.getElementById('state').value,
        addedNotes:   document.getElementById('addedNotes').value.trim(),
        formType:     'Caliper Paint Quote',
        source:       'Caliper Paint Form',
        submittedAt:  new Date().toISOString()
      };

      submitBtn.disabled = true;
      submitBtn.textContent = 'SUBMITTING…';

      try {
        await fetch(GHL_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        statusMsg.className = 'status-msg success';
        statusMsg.textContent = 'Thank you! Your enquiry has been submitted. We\'ll be in touch shortly.';
        document.getElementById('caliperForm').reset();
        makeSelect.disabled  = true;
        modelSelect.disabled = true;
      } catch (err) {
        statusMsg.className = 'status-msg error';
        statusMsg.textContent = 'Something went wrong. Please try again or call us on 1300 699 699.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'SUBMIT';
      }
    });
  </script>
